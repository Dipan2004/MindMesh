[project]
name = "graphrag-lite"
version = "0.1.0"
description = "Lightweight graph-RAG: structural filtering + Zvec hybrid retrieval + small local LLM"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.4.2,<4",
    "pydantic-settings>=2.2.1",
    "diskcache>=5.6.3",
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "tiktoken>=0.8.0",
    "sentence-transformers>=3.0.0",
    "ollama>=0.4.0",
    "langsmith>=0.1.0",
    "zvec",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
